name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

      # The editable install above reads files straight from src/, so it
      # cannot catch packaging mistakes. Build a real wheel and check that
      # the dashboard files are inside it.
      - name: Check wheel contents
        run: |
          pip wheel --no-deps -w dist .
          python - <<'EOF'
          import glob, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          expected = {f"agent_monitor/static/{f}" for f in ("index.html", "app.js", "styles.css")}
          missing = expected - names
          assert not missing, f"missing from wheel: {missing}"
          print("wheel contains", sorted(expected))
          EOF

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t agent-monitor:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name monitor -p 127.0.0.1:8765:8765 agent-monitor:ci
          # A plain loop: while the app starts, the port can accept and then
          # reset connections, which `curl --retry-connrefused` won't retry.
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/health
          python3 scripts/demo.py --speed 0
          curl -fsS http://127.0.0.1:8765/agents | grep -q weather-app
          curl -fsS http://127.0.0.1:8765/ | grep -q agent-list
          echo "container OK"

      - name: Container logs
        if: always()
        run: docker logs monitor
