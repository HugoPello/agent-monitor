<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-monitor</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">
        <svg class="brand-mark" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
          <circle cx="5" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="1.5" />
          <circle cx="15" cy="4.5" r="2.2" fill="currentColor" />
          <circle cx="15" cy="15.5" r="2.2" fill="currentColor" />
          <path d="M8 9 13 5.5M8 11l5 3.5" fill="none" stroke="currentColor" stroke-width="1.3" />
        </svg>
        agent-monitor
      </h1>
      <nav id="summary" class="summary" aria-label="Attention summary"></nav>
      <span id="connection" class="connection" role="status" aria-live="polite" data-state="connecting">
        connecting…
      </span>
    </header>

    <!-- Polite announcements for screen readers (a session needs you...). -->
    <p id="announcer" class="visually-hidden" aria-live="polite"></p>

    <main class="layout">
      <p id="empty" class="empty" hidden>
        No sessions yet. Enable the hook in a project and start Claude Code.
      </p>

      <section class="sessions" aria-labelledby="live-title">
        <h2 id="live-title" class="section-title">Live</h2>
        <p id="live-empty" class="quiet-note" hidden>Nothing running.</p>
        <ul id="agent-list" class="agent-list"></ul>
      </section>

      <section id="rest" class="sessions" aria-labelledby="rest-title" hidden>
        <h2 id="rest-title" class="section-title">At rest</h2>
        <ul id="rest-list" class="rest-list"></ul>
      </section>

      <p class="keys" aria-hidden="true">
        <kbd>w</kbd> next waiting · <kbd>f</kbd> next failure · <kbd>j</kbd> <kbd>k</kbd> move ·
        <kbd>Esc</kbd> close details
      </p>

      <!-- A <dialog>: modal sheet on small screens, side drawer on wide ones
           (app.js picks showModal() or show()). -->
      <dialog id="timeline" class="timeline" aria-labelledby="timeline-title timeline-subject">
        <header class="timeline-header">
          <div>
            <h2 id="timeline-title" class="section-title" tabindex="-1">Timeline</h2>
            <p id="timeline-subject" class="timeline-subject"></p>
          </div>
          <button id="close-timeline" type="button" class="icon-button" aria-label="Close timeline">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
        </header>
        <ol id="event-list" class="event-list"></ol>
      </dialog>
    </main>
  </body>
</html>
