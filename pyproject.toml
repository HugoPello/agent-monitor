[build-system]
requires = ["setuptools>=77"]  # 77+: SPDX `license` string (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "agent-monitor"
version = "0.1.0"
description = "Real-time monitor for Claude Code agents, fed by Claude Code hooks."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
]

[project.scripts]
agent-monitor = "agent_monitor.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "httpx2>=2.16",  # used by FastAPI's TestClient (plain httpx is deprecated there)
    "ruff>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

# Ship the dashboard files; by default only .py files end up in the wheel.
[tool.setuptools.package-data]
agent_monitor = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "hooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
